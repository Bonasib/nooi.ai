# nooi Studio render service on the VPS (beside the nooi.ai site, which keeps running as before under systemd).
#   PostgreSQL (renders, uploads, usage) · Redis (the BullMQ render queue) · the API (uploads, renders, status) · a render worker
#   (FFmpeg) · ClamAV (optional: --profile scan, needs about 1.5 GB of memory)
# Set up and started by deploy/render.sh; by hand:
#   docker compose -f /opt/nooi/studio/infra/docker-compose.yml --env-file /opt/nooi-render/.env -p nooi-render up -d --build
name: nooi-render
x-render: &render
  build: { context: .., dockerfile: services/render-api/Dockerfile }
  image: nooi-render-api:latest
  restart: unless-stopped
  env_file: [ "${RENDER_ENV_FILE:-/opt/nooi-render/.env}" ]
  environment:
    DATABASE_URL: postgresql://nooi:${PG_PASSWORD:?set PG_PASSWORD in the .env}@postgres:5432/nooi_studio
    REDIS_URL: redis://redis:6379
  extra_hosts: [ "host.docker.internal:host-gateway" ]   # the nooi.ai site on this VPS (who is signed in, their plan)
  volumes:
    - ${NOOI_MEDIA:-/opt/nooi/media}:/media:ro           # the site's media: nooi results and uploads, read only
    - ${RENDER_DATA:-/opt/nooi-render/data}:/data        # this service's uploads and finished renders (renders deleted after 7 days)
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment: { POSTGRES_USER: nooi, POSTGRES_PASSWORD: "${PG_PASSWORD:?set PG_PASSWORD in the .env}", POSTGRES_DB: nooi_studio }
    volumes: [ "pg:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U nooi -d nooi_studio" ], interval: 5s, timeout: 3s, retries: 20 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction" ]
    volumes: [ "redis:/data" ]
    healthcheck: { test: [ "CMD", "redis-cli", "ping" ], interval: 5s, timeout: 3s, retries: 20 }
  render-api:
    <<: *render
    environment:
      DATABASE_URL: postgresql://nooi:${PG_PASSWORD:?set PG_PASSWORD in the .env}@postgres:5432/nooi_studio
      REDIS_URL: redis://redis:6379
      RENDER_WORKER: "0"                                   # renders run in render-worker
    ports: [ "127.0.0.1:8790:8790" ]                       # only this VPS: the site passes /render-api/* here
  render-worker:
    <<: *render
    command: [ "pnpm", "worker" ]
    healthcheck: { disable: true }
  clamav:
    image: clamav/clamav:stable
    profiles: [ "scan" ]
    restart: unless-stopped
    volumes: [ "clamav:/var/lib/clamav" ]
volumes: { pg: {}, redis: {}, clamav: {} }
