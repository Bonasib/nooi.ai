<svg xmlns="http://www.w3.org/2000/svg" viewBox="188 196 704 704" role="img" aria-label="nooi.ai">
  <defs><linearGradient id="nooiG" gradientUnits="userSpaceOnUse" x1="230" y1="780" x2="850" y2="300"><stop offset="0" stop-color="#6EC046"/><stop offset=".5" stop-color="#9CD245"/><stop offset="1" stop-color="#CFE13E"/></linearGradient></defs>
  <!-- the line draws bottom-left → top-right -->
  <path pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" d="M260.2 765V523.2A71.05 71.05 0 0 1 402.3 523.2V665.6A65.2 65.2 0 0 0 532.7 665.6V479A69.45 69.45 0 0 1 671.6 479V662A67 67 0 0 0 805.6 662V391" fill="none" stroke="url(#nooiG)" stroke-width="82" stroke-linejoin="round">
    <animate attributeName="stroke-dashoffset" from="1" to="0" dur="1.4s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".65 0 .35 1"/>
  </path>
  <!-- halo: starts beating once the dot has landed -->
  <circle cx="802.5" cy="312.7" r="49.2" fill="none" stroke="#CFE13E" stroke-width="7" opacity="0">
    <animate attributeName="r" values="49.2;103;103" keyTimes="0;.7;1" dur="2.6s" begin="2.15s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values=".55;0;0" keyTimes="0;.7;1" dur="2.6s" begin="2.15s" repeatCount="indefinite"/>
  </circle>
  <!-- the dot rides the tip of the line, then hops onto the "i" -->
  <circle r="18" fill="#CFE13E">
    <animateMotion dur="2.05s" fill="freeze" path="M260.2 765V523.2A71.05 71.05 0 0 1 402.3 523.2V665.6A65.2 65.2 0 0 0 532.7 665.6V479A69.45 69.45 0 0 1 671.6 479V662A67 67 0 0 0 805.6 662V391 Q806 236 802.5 312.7" keyPoints="0;0.9262;1" keyTimes="0;0.6829;1" calcMode="spline" keySplines=".65 0 .35 1;.3 0 .4 1"/>
    <animate attributeName="r" values="18;41;49.2" keyTimes="0;0.6829;1" dur="2.05s" fill="freeze"/>
    <animate attributeName="r" values="49.2;56;49.2;49.2" keyTimes="0;.12;.24;1" dur="2.6s" begin="2.15s" repeatCount="indefinite"/>
  </circle>
</svg>
